<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2251FF; }
    a:hover { color: #1C44DC; }
  </style>
</helmet>
<div style="position:relative; width:816px; height:1056px; background:#001B2C; overflow:hidden; font-family:'Public Sans',-apple-system,'Segoe UI',sans-serif;">
  <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" style="position:absolute; inset:0; width:100%; height:100%;">
    <defs>
      <linearGradient id="flowA" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#99C4FF"/>
        <stop offset="45%" stop-color="#2251FF"/>
        <stop offset="75%" stop-color="#8B5CF6"/>
        <stop offset="100%" stop-color="#00A9F4"/>
      </linearGradient>
      <linearGradient id="flowB" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00A9F4"/>
        <stop offset="50%" stop-color="#5E9DFF"/>
        <stop offset="100%" stop-color="#C084FC"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect width="1000" height="1000" fill="#001B2C"/>
    <g filter="url(#glow)" opacity="0.9">
      <path d="M -100 880 C 250 360, 650 776, 1100 412" fill="none" stroke="url(#flowA)" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M -100 953 C 250 397, 650 841.8, 1100 452.6" fill="none" stroke="url(#flowB)" stroke-width="2.5" stroke-linecap="round" opacity="0.61"/>
      <path d="M -100 1026 C 250 434, 650 907.6, 1100 493.2" fill="none" stroke="url(#flowA)" stroke-width="5" stroke-linecap="round" opacity="0.67"/>
      <path d="M -100 1099 C 250 471, 650 973.4, 1100 533.8" fill="none" stroke="url(#flowB)" stroke-width="2.5" stroke-linecap="round" opacity="0.73"/>
      <path d="M -100 1172 C 250 508, 650 1039.2, 1100 574.4" fill="none" stroke="url(#flowA)" stroke-width="2.5" stroke-linecap="round" opacity="0.79"/>
      <path d="M -100 1245 C 250 545, 650 1105, 1100 615" fill="none" stroke="url(#flowB)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    </g>
  </svg>

  <div style="position:relative; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:64px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 17 L9 9 L14 13 L21 4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="21" cy="4" r="2" fill="#FFFFFF"/>
      </svg>
      <span style="font-size:13px; font-weight:600; letter-spacing:0.03em; color:#FFFFFF;">Meridian Analytics</span>
    </div>

    <div style="max-width:80%; display:flex; flex-direction:column; gap:16px;">
      <p style="margin:0; font-size:16px; font-weight:500; color:rgba(255,255,255,0.7);">Annual research</p>
      <h1 style="margin:0; font-family:'Source Serif 4',Georgia,'Times New Roman',serif; font-weight:600; font-size:66px; line-height:1.04; color:#FFFFFF;">The state of<br/>workplace automation</h1>
      <p style="margin:0; font-size:19px; line-height:1.5; color:rgba(255,255,255,0.85); max-width:90%;">Momentum, spending, and the gap between adoption and results</p>
      <p style="margin:0; padding-top:8px; font-size:12px; color:rgba(255,255,255,0.6);">March 2026</p>
    </div>

    <div></div>
  </div>
</div>
</x-dc>
</body>
</html>
